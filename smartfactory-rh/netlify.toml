# Site Netlify dédié à SmartFactory RH.
# Dans Netlify : « Base directory » = smartfactory-rh (le netlify.toml à la racine du dépôt reste réservé au site Miguel).
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
