<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Mes Cours{% endblock %} · Mes Cours</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {# Barre de navigation en haut de toutes les pages #}
  <header class="entete">
    <a class="logo" href="{{ url_for('accueil') }}">📚 Mes Cours</a>
    <nav>
      <a href="{{ url_for('accueil') }}" {% if request.endpoint == 'accueil' %}class="actif"{% endif %}>Accueil</a>
      <a href="{{ url_for('matieres') }}" {% if request.endpoint in ['matieres', 'matiere', 'modifier_note'] %}class="actif"{% endif %}>Matières</a>
      <a href="{{ url_for('echeances') }}" {% if request.endpoint == 'echeances' %}class="actif"{% endif %}>Échéances</a>
    </nav>
  </header>

  <main class="contenu">
    {# Petits messages de confirmation ou d'erreur #}
    {% for categorie, message in get_flashed_messages(with_categories=true) %}
      <div class="message {{ categorie }}">{{ message }}</div>
    {% endfor %}

    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
